services:
  db:
    image: postgis/postgis:16-3.5
    container_name: agri-fire-postgis
    environment:
      POSTGRES_DB: agri_fire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agri_fire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: agri-fire-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/agri_fire
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgis_data: