<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agri Fire Exposure Demo</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
            header {
                padding: 12px 16px;
                border-bottom: 1px solid #ddd;
            }
            header h1 {
                margin: 0;
                font-size: 20px;
            }
            header p {
                margin: 6px 0 0;
                color: #555;
                font-size: 14px;
            }
            #map {
                height: calc(100vh - 70px);
                width: 100%;
            }
            #exposure-panel {
                position: absolute;
                top: 82px;
                right: 16px;
                z-index: 1000;
                width: min(320px, calc(100vw - 32px));
                max-height: calc(100vh - 110px);
                overflow-y: auto;
                padding: 16px;
                box-sizing: border-box;
                background: #ffffff;
                border: 1px solid #cfd8dc;
                border-radius: 6px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            }

            #exposure-panel[hidden] {
                display: none;
            }

            #exposure-panel h2 {
                margin: 0 0 12px;
                font-size: 18px;
            }

            #exposure-panel dl {
                display: grid;
                grid-template-columns: 110px 1fr;
                gap: 6px 10px;
                margin: 0 0 12px;
            }

            #exposure-panel dt {
                color: #546e7a;
            }

            #exposure-panel dd {
                margin: 0;
                font-weight: 600;
            }

            #exposure-items {
                margin: 8px 0 0;
                padding-left: 20px;
            }

            #exposure-status {
                color: #546e7a;
            }

            #map-status {
                position: absolute;
                top: 82px;
                left: 50%;
                z-index: 1000;
                transform: translateX(-50%);
                margin: 0;
                padding: 10px 14px;
                color: #b71c1c;
                background: #ffffff;
                border: 1px solid #ef9a9a;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Wildfire Exposure</h1>
            <p>Land plots and wildfire perimeters loaded from FastAPI + POSTGIS</p>
        </header>
        <div id="map"></div>
        <p id="map-status" hidden role="status" aria-live="polite"></p>
        <aside id="exposure-panel" hidden aria-live="polite">
            <h2>wildfire Exposure</h2>
            <dl>
                <dt>Plot</dt>
                <dd id="selected-plot">-</dd>
                <dt>Plot area</dt>
                <dd id="selected-plot-area">-</dd>
                <dt>Fire count</dt>
                <dd id="selected-fire-count">-</dd>
            </dl>

            <p id="exposure-status"></p>
            <ul id="exposure-items"></ul>
        </aside>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const map = L.map("map").setView([49.15, -123.05], 10);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors",
            }).addTo(map);

            const allLayers = [];

            const exposureLayer = L.geoJSON(null,
                {
                    style: {
                        color: '#F9A825',
                        weight: 3,
                        fillColor: "#FFD54F",
                        fillOpacity: 0.55,
                        dashArray: "6 4",
                    },
                }
            ).addTo(map);

            async function fetchJson(url) {
                const response = await fetch(url, 
                    {
                        headers: {
                            Accept: "application/json",
                        },
                    }
                );

                let body = null;

                try {
                    body = await response.json();
                } catch (error) {
                    body = null;
                }

                if (!response.ok) {
                    const message = 
                        body?.error?.message ||
                        `Request failed (${response.status})`;

                    throw new Error(message);
                }

                if (body === null) {
                    throw new Error("Server returned an invalid JSON response.");
                }


                return body;
            }

            async function loadLandPlots() {
                const data = await fetchJson("/v1/land_plots/geojson");

                const landLayer = L.geoJSON(data, {
                    style: { color: "#2E7D32", weight: 2, fillOpacity: 0.25 },
                    onEachFeature: function(feature, layer) {
                        const p = feature.properties;
                        layer.bindPopup(`
                        <strong>Land Plot</strong><br>
                        PLOT ID: ${p.plot_id}<br>
                        Crop: ${p.crop_type}<br>
                        Area ha: ${p.area_ha}    
                        `);
                        layer.on("click", function () {
                            loadExposure(p.plot_id);
                        });
                    },
                }).addTo(map);

                allLayers.push(landLayer);
                return landLayer;
            }

            async function loadFirePerimeters() {
                const data = await fetchJson("/v1/fire_perimeters/geojson");

                const fireLayer = L.geoJSON(data, {
                    style: { color: "#C62828", weight: 2, fillOpacity: 0.35 },
                    onEachFeature: function (feature, layer) {
                    const p = feature.properties;
                    layer.bindPopup(`
                        <strong>Fire Perimeter</strong><br>
                        Name: ${p.name}<br>
                        Event ID: ${p.event_id}<br>
                        Source: ${p.source}
                    `);
                    },
                }).addTo(map);

                allLayers.push(fireLayer);
                return fireLayer;
            }

            function renderExposurePanel(data) {
                const panel = document.getElementById("exposure-panel");
                const plotElement = document.getElementById("selected-plot");
                const areaElement = document.getElementById("selected-plot-area");
                const countElement = document.getElementById("selected-fire-count");
                const statusElement = document.getElementById("exposure-status");
                const itemsElement = document.getElementById("exposure-items");
                
                panel.hidden = false;
                plotElement.textContent = data.plot_id;
                areaElement.textContent = 
                `${Number(data.plot_area_m2 || 0).toLocaleString()}m2`;
                countElement.textContent = String(data.fire_count);

                itemsElement.replaceChildren();

                const features = Array.isArray(data.features)
                    ? data.features
                    : [];

                if (features.length === 0) {
                    statusElement.textContent = 
                    "No overlapping wildfire perimeters.";
                    return;
                }

                statusElement.textContent = "";

                for (const feature of features) {
                    const properties = feature.properties;
                    const item = document.createElement("li");

                    const fireName = 
                        properties.name ||
                        properties.event_id ||
                        `Fire${properties.event_id}`;
                    
                    const area = Number(
                        properties.intersection_area_m2 || 0
                    );

                    const percentage = Number(
                        properties.intersection_pct || 0
                    );

                    item.textContent = 
                    `${fireName}: ${area.toLocaleString()}m2` +
                    `(${percentage.toFixed(2)}%)`;

                    itemsElement.appendChild(item);
                }
            }

            async function loadExposure(plotId) {
                const panel = document.getElementById("exposure-panel");
                const statusElement =document.getElementById("exposure-status");
                const itemsElement = document.getElementById('exposure-items');

                panel.hidden = false;
                statusElement.textContent = "Loading exposure...";
                itemsElement.replaceChildren();
                exposureLayer.clearLayers();

                try {
                    const encodedPlotId = encodeURIComponent(plotId);
                    const data = await fetchJson(`/v1/exposure/plots/${encodedPlotId}/geojson`);
                    
                    exposureLayer.addData(data);
                    renderExposurePanel(data);

                    if (
                        data.features.length > 0 &&
                        exposureLayer.getBounds().isValid()
                    ) {
                        exposureLayer.bringToFront();

                        map.fitBounds(exposureLayer.getBounds(), {
                            padding: [40, 40],
                            maxZoom: 14,
                        });
                    }
                    
                } catch(error) {
                    exposureLayer.clearLayers();

                    statusElement.textContent =
                        `Unable to load exposure: ${error.message}`;

                    console.error("Exposure request failed:", error);
            }
        }

            async function init() {
                const landLayer = await loadLandPlots();
                const fireLayer = await loadFirePerimeters();

                L.control.layers(
                    null,
                    {
                        "Land plots": landLayer,
                        "Fire perimeters": fireLayer,
                        "Exposure overlap": exposureLayer, 
                    },
                    {
                        collapsed: false,
                    }
                ).addTo(map);

                const group = L.featureGroup(allLayers);
                if (allLayers.length > 0 && group.getBounds().isValid()) {
                    map.fitBounds(group.getBounds(), { padding: [30, 30] });
                }
            }

            init().catch(function (error) {
                const statusElement = document.getElementById("map-status");
                statusElement.hidden = false;
                statusElement.textContent =
                    `Unable to load map data: ${error.message}`;
                console.error("Map initialization failed:", error);
            });
        </script>
    </body>
</html>
